name: gates
on:
  pull_request:
  push:
    branches: [main]
# npm ci runs third-party install scripts, so the token carries no write scope.
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs because tags can be moved; the comment names the tag.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The identity check reads every commit and refuses a shallow clone.
          fetch-depth: 0
          # No step after this one can push with the checkout token, so a compromised install
          # script has nothing to steal that reaches the repository.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # No third-party install script runs during install; only the one allowlisted rebuild
      # (esbuild's own postinstall, which downloads its platform binary) runs afterward, alone.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # This repo's tooling (vitest, stryker, esbuild, the CDK CLI) is entirely devDependencies,
      # so a scan that skips them audits almost nothing here. Runs on pull requests and pushes,
      # before anything is built, so an unmerged pull request never lands a new HIGH or CRITICAL
      # finding unnoticed and nothing this step reads was produced by a later step.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-vulns.json
          exit-code: '0'
          list-all-pkgs: 'true'
          cache: 'true'
      - name: fail on HIGH/CRITICAL vulnerabilities
        run: |
          test -s trivy-vulns.json || { echo 'trivy produced no report - refusing to read that as clean'; exit 1; }
          jq -e . trivy-vulns.json > /dev/null || { echo 'trivy report did not parse - refusing to read that as clean'; exit 1; }
          # A package count cannot tell the two scans apart: without dev dependencies the lockfile
          # still reports the providers workspace's production tree (157 packages against 611 with
          # them, measured 2026-09-28 with trivy 0.74.0). vitest is a devDependency that never ships,
          # so it is listed exactly when dev dependencies were scanned.
          lockfile_pkgs=$(jq '[.Results[]? | select(.Target=="package-lock.json") | .Packages[]?] | length' trivy-vulns.json)
          dev_marker=$(jq '[.Results[]? | select(.Target=="package-lock.json") | .Packages[]? | select(.Name=="vitest")] | length' trivy-vulns.json)
          echo "package-lock.json packages in the report: $lockfile_pkgs, vitest entries: $dev_marker"
          if [ "$dev_marker" -lt 1 ]; then
            echo 'the report does not list vitest, a devDependency, so this scan skipped dev dependencies - refusing to read that as clean'
            exit 1
          fi
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-vulns.json)
          echo "HIGH/CRITICAL vulnerabilities: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.Results[]? | .Target as $t | (.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | "\($t): \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) (\(.Severity))")' trivy-vulns.json
            exit 1
          fi
      # Security floor on pushes to main only, so an unmerged pull request never prints an open
      # license finding that nobody asked for. The vulnerability scan above carries no such
      # condition; only this census does.
      - if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-licenses.json
          exit-code: '0'
          cache: 'true'
      - if: github.event_name == 'push'
        name: assert the license census ran
        run: |
          test -s trivy-licenses.json || { echo 'license census produced no report'; exit 1; }
          jq -e . trivy-licenses.json > /dev/null || { echo 'license census report did not parse'; exit 1; }
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-census
          path: trivy-licenses.json
      - run: npm run verify:ship
      # Only a workspace that BUILDS can leak a secret into a client bundle, so the loop is keyed
      # on scripts.build rather than a fixed apps/web path: the site does not exist yet, and this
      # reaches it the day it does, without a second edit here. Each workspace found prints its
      # own scan; the SKIPPED line names the reason only when none declares a build at all.
      - name: client bundle secret scan
        run: |
          found_build=0
          for manifest in packages/*/package.json; do
            [ -f "$manifest" ] || continue
            workspace=$(dirname "$manifest")
            has_build=$(jq -r '.scripts.build // empty' "$manifest")
            if [ -n "$has_build" ]; then
              found_build=1
              node scripts/check-client-secrets.mjs "$workspace/dist"
            fi
          done
          if [ "$found_build" -eq 0 ]; then
            echo "client bundle secret scan: SKIPPED, no packages/*/package.json declares a build script in this revision"
          fi
