name: gates
on:
  pull_request:
  push:
    branches: [main]
# npm ci runs third-party install scripts, so the token carries no write scope.
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19: an image change
    # then would alter the toolchain this gate measures nine days before the submission deadline.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs because tags can be moved; the comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The identity check reads every commit and refuses a shallow clone.
          fetch-depth: 0
          # No step after this one can push with the checkout token, so a compromised install
          # script has nothing to steal that reaches the repository.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No third-party install script runs during install; only the one allowlisted rebuild runs
      # afterward, alone. esbuild's postinstall finds its platform binary in the @esbuild/*
      # optional package the lockfile already installed, links it in and checks its version; it
      # downloads only when that package is missing. esbuild also runs without it (checked
      # 2026-09-28 with a scriptless install, build and agent tests all green).
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      # This repo's tooling (vitest, stryker, esbuild, the CDK CLI) is entirely devDependencies,
      # and trivy leaves those out unless told: without the flag below, a scan of main's lockfile
      # read 1 of its 444 locked packages. Runs on pull requests and pushes, before anything is
      # built, so an unmerged pull request never lands a new HIGH or CRITICAL finding unnoticed and
      # nothing this step reads was produced by a later step. The action has no input for that
      # flag; its README says such flags go in as TRIVY_* variables. list-all-pkgs makes the report
      # list what it scanned, and `version` pins trivy itself rather than the action's default
      # (v0.70.0 in v0.36.0): 0.69.3, the default before it, dropped a lockfile whose license field
      # is a list, which 0.74.0 reads (GHSA-69fq-xp46-6x23 names 0.69.4 as the one malicious release). `trivy-config: /dev/null` keeps a trivy.yaml in this
      # repository out of the verdict: trivy reads that file from the folder it runs in, and the
      # action passes on only the inputs that differ from its defaults, so a `severity: [LOW]`
      # there would turn this verdict green over HIGH findings. .trivyignore still applies, one
      # advisory per line.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          list-all-pkgs: 'true'
          format: json
          output: trivy-vulns.json
          exit-code: '0'
          cache: 'true'
          version: v0.74.0
          trivy-config: /dev/null
      - name: fail on HIGH/CRITICAL vulnerabilities
        run: |
          test -s trivy-vulns.json || { echo 'trivy produced no report - refusing to read that as clean'; exit 1; }
          # Exactly one JSON object: with two, each count below prints two numbers, and bash skips a
          # test whose arithmetic fails together with its refusal.
          jq -se 'length == 1 and (.[0] | type) == "object"' trivy-vulns.json > /dev/null || { echo 'trivy report did not parse as one JSON object - refusing to read that as clean'; exit 1; }
          # The report must list at least 9 in 10 of the packages package-lock.json locks, counted
          # as trivy counts them (one per name and version, an alias by the name its entry carries,
          # links left out), or a scan that saw part of the tree reads as clean.
          locked=$(jq '[.packages // {} | to_entries[] | select(.key != "" and (.value.link | not)) | "\(.value.name // (.key | sub("^.*node_modules/"; "")))@\(.value.version)"] | unique | length' package-lock.json) || { echo 'package-lock.json is missing or did not parse - refusing to judge the report. On pnpm, yarn or bun, count that lockfile in this step instead'; exit 1; }
          [ "$locked" -gt 0 ] || { echo 'package-lock.json locks no packages in the form counted here (a v1 lockfile has none) - refusing to judge the report'; exit 1; }
          scanned=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Target == "package-lock.json") | .Packages[]?] | length' trivy-vulns.json)
          echo "packages listed: $scanned of $locked locked in package-lock.json"
          [ $((scanned * 10)) -ge $((locked * 9)) ] || { echo 'trivy listed too few of the locked packages - refusing to read that as clean. Causes seen so far: TRIVY_INCLUDE_DEV_DEPS missing from the scan step, or a trivy that cannot parse the lockfile (0.69.3 on a license list)'; exit 1; }
          # A named devDependency proves dev dependencies were scanned, whatever the counts read:
          # without them the lockfile still reports the providers workspace's production tree (157
          # packages against 611 with them, measured 2026-09-28 with trivy 0.74.0). vitest is a
          # devDependency that never ships, so it is listed exactly when dev dependencies were scanned.
          dev_marker=$(jq '[.Results[]? | select(.Target=="package-lock.json") | .Packages[]? | select(.Name=="vitest")] | length' trivy-vulns.json)
          echo "vitest entries: $dev_marker"
          if [ "$dev_marker" -lt 1 ]; then
            echo 'the report does not list vitest, a devDependency, so this scan skipped dev dependencies - refusing to read that as clean'
            exit 1
          fi
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-vulns.json)
          echo "HIGH/CRITICAL vulnerabilities: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.Results[]? | .Target as $t | (.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | "\($t): \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) (\(.Severity))")' trivy-vulns.json
            exit 1
          fi
      # The license census runs on pushes to main only, so an unmerged pull request never prints an
      # open license finding that nobody asked for; the vulnerability verdict above carries no such
      # condition. The census reports and never fails on a license, but it must exist, parse and
      # cover the lockfile, with dev dependencies in and any trivy.yaml out, for the reasons above.
      # Its steps run on !cancelled() rather than the default success(), so a failing
      # vulnerability verdict, which can stay red until an upstream fix ships, does not switch the
      # census off with it.
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          list-all-pkgs: 'true'
          format: json
          output: trivy-licenses.json
          exit-code: '0'
          cache: 'true'
          version: v0.74.0
          trivy-config: /dev/null
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        name: assert the license census ran
        run: |
          test -s trivy-licenses.json || { echo 'license census produced no report'; exit 1; }
          jq -se 'length == 1 and (.[0] | type) == "object"' trivy-licenses.json > /dev/null || { echo 'license census report did not parse as one JSON object'; exit 1; }
          # The same coverage floor as the vulnerability verdict above.
          locked=$(jq '[.packages // {} | to_entries[] | select(.key != "" and (.value.link | not)) | "\(.value.name // (.key | sub("^.*node_modules/"; "")))@\(.value.version)"] | unique | length' package-lock.json) || { echo 'package-lock.json is missing or did not parse - refusing to judge the report. On pnpm, yarn or bun, count that lockfile in this step instead'; exit 1; }
          [ "$locked" -gt 0 ] || { echo 'package-lock.json locks no packages in the form counted here (a v1 lockfile has none) - refusing to judge the report'; exit 1; }
          scanned=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Target == "package-lock.json") | .Packages[]?] | length' trivy-licenses.json)
          echo "packages listed: $scanned of $locked locked in package-lock.json"
          [ $((scanned * 10)) -ge $((locked * 9)) ] || { echo 'trivy listed too few of the locked packages - refusing to read that as clean. Causes seen so far: TRIVY_INCLUDE_DEV_DEPS missing from the scan step, or a trivy that cannot parse the lockfile (0.69.3 on a license list)'; exit 1; }
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-census
          path: trivy-licenses.json
      - run: npm run verify:ship
      # Only a workspace that BUILDS can leak a secret into a client bundle, so the loop is keyed
      # on scripts.build rather than a fixed apps/web path, and it reads apps/* as well as
      # packages/*: the site does not exist yet, and this reaches it the day it does, without a
      # second edit here. A declared build whose dist/ is missing fails the scan (exit 2, could not
      # run), so a site added later must build before this step. Each workspace found prints its
      # own scan; the SKIPPED line names the reason only when none declares a build at all. The
      # repo root's dist/ holds server bundles only (Lambda handlers, the agent runtime).
      - name: client bundle secret scan
        run: |
          found_build=0
          for manifest in packages/*/package.json apps/*/package.json; do
            [ -f "$manifest" ] || continue
            workspace=$(dirname "$manifest")
            has_build=$(jq -r '.scripts.build // empty' "$manifest")
            if [ -n "$has_build" ]; then
              found_build=1
              node scripts/check-client-secrets.mjs "$workspace/dist"
            fi
          done
          if [ "$found_build" -eq 0 ]; then
            echo "client bundle secret scan: SKIPPED, no packages/* or apps/* package.json declares a build script in this revision"
          fi
